services:
  postgres:
    image: postgres:15
    container_name: evolution-postgres
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: always
    depends_on:
      - postgres
    ports:
      # só localhost — o Flask (fora do Docker, no mesmo host) já alcança
      # por aqui; o firewall (ufw) também bloqueia 8080 de fora, isso é
      # uma segunda camada de proteção, não a única
      - "127.0.0.1:8080:8080"
    extra_hosts:
      # host.docker.internal funciona sozinho no Docker Desktop
      # (Windows/Mac), mas no Linux (como esta VPS) precisa ser mapeado
      # manualmente pro gateway do host — sem isso a Evolution API não
      # consegue chamar de volta o Flask rodando fora do container.
      - "host.docker.internal:host-gateway"
    environment:
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      # Sem isso, o webhook só manda a URL criptografada da mídia no CDN
      # do WhatsApp (que a gente não consegue baixar sem a chave de
      # decriptação do protocolo Signal) — com isso, a Evolution API já
      # manda o conteúdo da mídia em base64 dentro do próprio payload.
      WEBHOOK_BASE64: "true"

volumes:
  evolution_postgres_data:
