<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seja Alpha</title>
  <meta name="theme-color" content="#0a7d67">
  <!-- Ícone da barra de tarefas / aba. Era um emoji 💬 desenhado em SVG,
       que aparecia igual pra todo mundo e não tinha nada a ver com a
       marca. Agora é a logo real, nos tamanhos que o Windows procura. -->
  <!-- Vários tamanhos de propósito: o navegador escolhe o mais próximo
       do que precisa. Só com 16 e 32 ele acabava esticando o pequeno em
       tela de alta resolução, e o ícone da barra de tarefas saía
       borrado. -->
  <link rel="icon" type="image/png" sizes="16x16" href="/static/img/icone-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/icone-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/static/img/icone-48.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/img/icone-64.png">
  <link rel="icon" type="image/png" sizes="128x128" href="/static/img/icone-128.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/img/icone-192.png">
  <link rel="icon" type="image/png" sizes="256x256" href="/static/img/icone-256.png">
  <link rel="shortcut icon" href="/static/img/whatts_inbox.ico">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/img/icone-180.png">
  <!-- iPhone ignora o manifest: é por estas duas metas que ele abre em
       tela cheia quando adicionado à tela de início. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Seja Alpha">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="app"><div class="carregando-inicial">Carregando…</div></div>
  <script src="/static/app.js"></script>
</body>
</html>
