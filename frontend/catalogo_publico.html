<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo Alphafitus</title>
<style>
  :root {
    --verde: #1fa855; --verde-escuro: #0f6b34; --fundo: #f4f7f5; --superficie: #ffffff;
    --texto: #1c2b22; --texto-suave: #62766a; --borda: #e2e8e4; --raio: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--fundo); color: var(--texto); padding-bottom: 90px; }
  .cabecalho { background: linear-gradient(135deg, var(--verde-escuro), var(--verde)); color: #fff; padding: 22px 16px 26px; text-align: center; }
  .cabecalho img { max-height: 44px; margin-bottom: 8px; }
  .cabecalho h1 { margin: 4px 0 2px; font-size: 19px; }
  .cabecalho p { margin: 0; font-size: 13px; opacity: 0.92; }
  .conteudo { max-width: 620px; margin: 0 auto; padding: 16px; }
  .cartao-item { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); padding: 16px; margin-bottom: 16px; }
  .item-principal { display: flex; gap: 16px; flex-wrap: wrap; }
  .item-galeria { flex: 0 0 auto; display: flex; flex-direction: row; gap: 6px; }
  .item-galeria-principal { width: 150px; height: 150px; border-radius: 10px; overflow: hidden; background: var(--fundo); display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; }
  .item-galeria-principal img, .item-galeria-principal video { width: 100%; height: 100%; object-fit: cover; }
  .item-galeria-minis { display: flex; flex-direction: column; gap: 6px; max-height: 150px; overflow-y: auto; order: -1; }
  .item-galeria-mini { width: 34px; height: 34px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; background: var(--fundo); position: relative; flex-shrink: 0; }
  .item-galeria-mini img, .item-galeria-mini video { width: 100%; height: 100%; object-fit: cover; }
  .item-galeria-mini.ativa { border-color: var(--verde); }
  .item-galeria-mini .selo-video { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.35); color: #fff; font-size: 10px; }
  .item-info { flex: 1; min-width: 200px; }
  .item-info h3 { margin: 0 0 3px; font-size: 15px; }
  .item-info .meta { font-size: 12px; color: var(--texto-suave); }
  .item-complemento { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--verde) 8%, transparent); font-size: 12.5px; color: var(--verde-escuro); white-space: pre-line; }
  .titulo-categoria { margin: 22px 2px 10px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--verde-escuro); padding-bottom: 6px; border-bottom: 2px solid var(--verde); }
  .titulo-categoria:first-child { margin-top: 4px; }
  .bloco-nutricional { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--borda); }
  .titulo-nutricional { margin: 0 0 6px; font-size: 12.5px; font-weight: 700; color: var(--texto); }
  .item-preco { font-size: 13px; color: var(--verde-escuro); font-weight: 700; margin-top: 4px; }
  .item-linha-qtd { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .item-linha-qtd label { font-size: 12.5px; color: var(--texto-suave); }
  .item-linha-qtd input[type="number"] { width: 90px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--borda); font-size: 14px; }
  .item-preco-unit { color: var(--verde-escuro); font-size: 13px; font-weight: 600; }
  .item-subtotal { margin-left: auto; font-weight: 700; font-size: 14px; }
  .faixas-ref { font-size: 11px; color: var(--texto-suave); margin-top: 8px; line-height: 1.6; }
  @keyframes piscar-aviso { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  .aviso-desconto { display: none; align-items: center; gap: 6px; margin-top: 8px; padding: 7px 10px; border-radius: 8px; background: #fff6e0; color: #8a5a00; font-size: 12px; font-weight: 600; animation: piscar-aviso 1.6s ease-in-out infinite; }
  .aviso-desconto.mostrar { display: flex; }
  details { margin-top: 10px; }
  summary { cursor: pointer; font-size: 12.5px; color: var(--verde-escuro); font-weight: 600; }
  .tabela-nutri { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  .tabela-nutri th, .tabela-nutri td { border: 1px solid var(--borda); padding: 5px 8px; text-align: left; }
  .tabela-nutri th { background: var(--fundo); }
  .bloco-texto-nutri { font-size: 12px; color: var(--texto-suave); margin-top: 8px; line-height: 1.5; }
  .barra-total { position: fixed; bottom: 0; left: 0; right: 0; background: var(--superficie); border-top: 1px solid var(--borda); padding: 12px 16px; display: flex; align-items: center; gap: 14px; box-shadow: 0 -4px 14px rgba(0,0,0,0.06); }
  .barra-total .resumo { flex: 1; font-size: 13px; }
  .barra-total .resumo strong { display: block; font-size: 17px; color: var(--verde-escuro); }
  .botao { background: var(--verde); color: #fff; border: none; border-radius: 999px; padding: 12px 22px; font-size: 14.5px; font-weight: 700; cursor: pointer; }
  .botao:disabled { opacity: 0.5; cursor: not-allowed; }
  .estado { text-align: center; padding: 60px 20px; color: var(--texto-suave); }
  .estado h2 { color: var(--texto); }
  [hidden] { display: none !important; }
  .sucesso { text-align: center; padding: 60px 20px; }
  .sucesso .icone { font-size: 52px; }
  .capa { position: fixed; inset: 0; background: #eef1ef; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; padding: 24px 20px 34px; }
  .capa img.capa-fundo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; z-index: -1; }
  .capa .botao { position: relative; padding: 14px 34px; font-size: 15.5px; box-shadow: 0 6px 18px rgba(31,168,85,0.35); }
  .barra-modo { display: flex; justify-content: flex-end; margin-bottom: 10px; }
  .botao-modo { background: var(--superficie); border: 1px solid var(--borda); color: var(--verde-escuro); border-radius: 999px; padding: 7px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .nav-tela-cheia { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; position: sticky; top: 0; background: var(--fundo); padding: 8px 0; z-index: 5; }
  .nav-passos { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--texto-suave); font-variant-numeric: tabular-nums; }
  .botao-seta { width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--borda); background: var(--superficie); font-size: 18px; cursor: pointer; }
  .botao-seta:disabled { opacity: 0.35; cursor: not-allowed; }
  #lista-itens.modo-cheia .titulo-categoria { display: none; }
  .categoria-inline { display: none; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--verde-escuro); margin-bottom: 4px; }
  #lista-itens.modo-cheia .categoria-inline { display: block; }
  #lista-itens.modo-cheia .cartao-item { padding: 20px; }
  @media (min-width: 480px) {
    #lista-itens.modo-cheia .item-galeria-principal { width: 210px; height: 210px; }
    #lista-itens.modo-cheia .item-galeria-mini { width: 40px; height: 40px; }
  }
  /* Na tela cheia, usa a largura disponível de verdade em vez de ficar
     preso nos 620px da lista normal -- em tela grande sobrava espaço
     vazio enorme nas laterais. */
  body.modo-cheia-ativo .conteudo { max-width: 1180px; }
  @media (min-width: 860px) {
    body.modo-cheia-ativo #lista-itens.modo-cheia .item-principal { gap: 40px; }
    body.modo-cheia-ativo #lista-itens.modo-cheia .item-galeria-principal { width: 460px; height: 380px; }
    body.modo-cheia-ativo #lista-itens.modo-cheia .item-galeria-mini { width: 76px; height: 76px; }
    body.modo-cheia-ativo #lista-itens.modo-cheia .item-galeria-minis { max-height: 460px; }
    body.modo-cheia-ativo #lista-itens.modo-cheia .item-info { min-width: 340px; }
    body.modo-cheia-ativo #lista-itens.modo-cheia .item-info h3 { font-size: 24px; }
    body.modo-cheia-ativo #lista-itens.modo-cheia .categoria-inline { font-size: 13px; }
    body.modo-cheia-ativo #lista-itens.modo-cheia .item-info .meta { font-size: 14px; }
  }
  .legenda-categorias { margin: 4px 2px 12px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--texto-suave); }
  .grade-categorias { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; perspective: 900px; }
  .tile-categoria {
    --tint: var(--verde); grid-column: span 1; position: relative; text-align: left; cursor: pointer;
    background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio);
    padding: 16px 14px; display: flex; flex-direction: column; gap: 8px; font-family: inherit;
    transform-style: preserve-3d; transition: transform 0.3s cubic-bezier(0.2,0.7,0.3,1), box-shadow 0.3s ease, border-color 0.3s ease;
    opacity: 0; transform: translateY(14px); animation: subir-categoria 0.5s cubic-bezier(0.2,0.7,0.3,1) forwards;
    animation-delay: calc(var(--i, 0) * 55ms);
  }
  @keyframes subir-categoria { to { opacity: 1; transform: translateY(0); } }
  .tile-categoria:hover, .tile-categoria:focus-visible { box-shadow: 0 16px 30px -16px color-mix(in srgb, var(--tint) 55%, transparent); border-color: color-mix(in srgb, var(--tint) 45%, var(--borda)); outline: none; }
  .icone-categoria {
    width: 40px; height: 40px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
    font-size: 19px; background: color-mix(in srgb, var(--tint) 16%, var(--superficie));
  }
  .tile-categoria-nome { font-weight: 700; font-size: 13.5px; color: var(--texto); }
  .tile-categoria-qtd { font-size: 11.5px; color: var(--texto-suave); }
  .tile-todos {
    --tint: #ffffff; grid-column: span 2; flex-direction: row; align-items: center; gap: 14px;
    background: linear-gradient(120deg, var(--verde-escuro), var(--verde) 130%); border: none;
  }
  .tile-todos .icone-categoria { background: rgba(255,255,255,0.18); }
  .tile-todos .tile-categoria-nome { color: #fff; font-size: 14.5px; }
  .tile-todos .tile-categoria-qtd { color: rgba(255,255,255,0.82); }
  .barra-modo { justify-content: space-between; }
</style>
</head>
<body>
  <div id="tela-capa" class="capa" hidden>
    <img class="capa-fundo" src="/static/img/catalogo_capa.jpg" alt="Catálogo Alphafitus">
    <button type="button" class="botao" id="botao-comecar">Ver catálogo</button>
  </div>
  <div class="cabecalho">
    <img id="logo" src="" alt="" hidden>
    <h1 id="titulo-saudacao">Catálogo Alphafitus</h1>
    <p>Escolha os produtos e as quantidades — o valor certinho aparece na hora.</p>
  </div>
  <div class="conteudo">
    <div id="estado-carregando" class="estado">Carregando catálogo…</div>
    <div id="estado-erro" class="estado" hidden><h2>😕 Ops</h2><p id="texto-erro"></p></div>
    <div id="tela-categorias" class="tela-categorias" hidden>
      <div class="legenda-categorias">Categorias</div>
      <div class="grade-categorias" id="grade-categorias"></div>
    </div>
    <div id="barra-modo" class="barra-modo" hidden>
      <button type="button" class="botao-modo" id="botao-trocar-categoria">🏷️ Categorias</button>
      <button type="button" class="botao-modo" id="botao-tela-cheia">⛶ Ver um produto por vez (tela cheia)</button>
    </div>
    <div id="nav-tela-cheia" class="nav-tela-cheia" hidden>
      <button type="button" id="botao-sair-tela-cheia" class="botao-modo">📋 Ver lista completa</button>
      <div class="nav-passos">
        <button type="button" id="botao-anterior" class="botao-seta">‹</button>
        <span id="contador-tela-cheia">1 / 1</span>
        <button type="button" id="botao-proximo" class="botao-seta">›</button>
      </div>
    </div>
    <div id="lista-itens" hidden></div>
    <div id="tela-sucesso" class="sucesso" hidden>
      <div class="icone">✅</div>
      <h2>Proposta enviada!</h2>
      <p>Já chegou certinho na sua conversa do WhatsApp. Em breve alguém da nossa equipe entra em contato.</p>
    </div>
  </div>
  <div class="barra-total" id="barra-total" hidden>
    <div class="resumo"><span id="resumo-itens">0 itens</span><strong id="resumo-total">R$ 0,00</strong></div>
    <button type="button" class="botao" id="botao-enviar">Enviar proposta</button>
  </div>

<script>
(function () {
  const token = location.pathname.split("/").filter(Boolean).pop();
  const API = "/api/v1/catalogo-publico";
  let itens = [];
  let categoriasInfo = []; // [{nome, icone, cor, qtd}] -- vem da API
  let categoriaAtual = null; // null = "ver todos"
  const quantidades = {}; // item_id -> quantidade

  function fmtMoeda(v) {
    return Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function precoDaFaixa(item, qtd) {
    if (!qtd || qtd <= 0) return null;
    const faixa = item.faixas.find((f) => qtd >= f.quantidade_min && (f.quantidade_max == null || qtd <= f.quantidade_max));
    return faixa ? faixa.preco : null;
  }

  // "Empurrãozinho" pra próxima faixa -- pedido do Clayton: se o
  // cliente está perto (mas não chegou) da próxima faixa mais barata,
  // avisa quantas unidades faltam. A margem que conta como "perto" é
  // 5% da quantidade mínima da próxima faixa (nunca menos que 10 un.) --
  // se ele tá em 490 e a próxima começa em 501 (margem de 25), entra;
  // se ele tá em 100, não incomoda à toa.
  function _dicaProximaFaixa(item, qtd) {
    if (!qtd || qtd <= 0) return null;
    const faixasOrdenadas = [...item.faixas].sort((a, b) => a.quantidade_min - b.quantidade_min);
    const indiceAtual = faixasOrdenadas.findIndex((f) => qtd >= f.quantidade_min && (f.quantidade_max == null || qtd <= f.quantidade_max));
    const proxima = faixasOrdenadas[indiceAtual + 1];
    if (!proxima) return null; // já está na faixa mais barata
    const faltam = proxima.quantidade_min - qtd;
    const margem = Math.max(10, Math.round(proxima.quantidade_min * 0.05));
    if (faltam <= 0 || faltam > margem) return null;
    return `💡 Coloque mais ${faltam} un. e o preço cai pra ${fmtMoeda(proxima.preco)} cada!`;
  }

  function htmlFaixasRef(item) {
    return item.faixas.map((f) => {
      const alcance = f.quantidade_max ? `${f.quantidade_min}–${f.quantidade_max}` : `${f.quantidade_min}+`;
      return `${alcance} un.: ${fmtMoeda(f.preco)}`;
    }).join(" · ");
  }

  function htmlNutricional(item) {
    if (!item.nutrientes.length && !item.ingredientes && !item.modo_de_uso) return "";
    const linhasTabela = item.nutrientes.map((n) => `<tr><td>${escapeHtml(n.nome)}</td><td>${escapeHtml(n.quantidade || "")}</td><td>${escapeHtml(n.vd || "")}</td></tr>`).join("");
    // Sempre aberta (não é mais <details> recolhível) -- pedido do
    // Clayton: "pode até deixar a tabela assim sempre aberta".
    return `
      <div class="bloco-nutricional">
        <p class="titulo-nutricional">Informação nutricional</p>
        ${item.porcao ? `<p class="bloco-texto-nutri"><strong>Porção:</strong> ${escapeHtml(item.porcao)}</p>` : ""}
        ${linhasTabela ? `<table class="tabela-nutri"><thead><tr><th>Nutriente</th><th>Qtd.</th><th>%VD</th></tr></thead><tbody>${linhasTabela}</tbody></table>` : ""}
        ${item.observacao_nutricional ? `<p class="bloco-texto-nutri">${escapeHtml(item.observacao_nutricional)}</p>` : ""}
        ${item.ingredientes ? `<p class="bloco-texto-nutri"><strong>Ingredientes:</strong> ${escapeHtml(item.ingredientes)}</p>` : ""}
        ${item.modo_de_uso ? `<p class="bloco-texto-nutri"><strong>Modo de uso:</strong> ${escapeHtml(item.modo_de_uso)}</p>` : ""}
      </div>`;
  }

  function _htmlMidia(im, classe) {
    return im.tipo === "video"
      ? `<video src="${im.url}" ${classe.includes("principal") ? "controls" : "muted"}></video>`
      : `<img src="${im.url}" alt="">`;
  }

  function htmlGaleria(item) {
    const imagens = item.imagens && item.imagens.length ? item.imagens : [];
    const principal = imagens[0] || null;
    return `
      <div class="item-galeria" data-galeria-produto="${item.id}">
        <div class="item-galeria-principal" data-galeria-principal>
          ${principal ? _htmlMidia(principal, "principal") : `<span>📦</span>`}
        </div>
        ${imagens.length > 1 ? `
          <div class="item-galeria-minis">
            ${imagens.map((im, i) => `
              <div class="item-galeria-mini ${i === 0 ? "ativa" : ""}" data-galeria-mini data-indice="${i}">
                ${_htmlMidia(im, "mini")}
                ${im.tipo === "video" ? `<span class="selo-video">▶</span>` : ""}
              </div>`).join("")}
          </div>` : ""}
      </div>`;
  }

  function renderItens() {
    const lista = document.getElementById("lista-itens");
    // O backend já manda ordenado por categoria (linha) -- aqui só
    // detecta quando ela muda pra inserir um cabeçalho de seção.
    // Pedido do Clayton: "no portifólio colocar sempre por ordem de
    // categoria" + "só deve aparecer a que ela pertence".
    let categoriaAnterior = undefined;
    lista.innerHTML = itens.map((item) => {
      const categoria = (item.linha || "").trim();
      let cabecalho = "";
      if (categoria !== categoriaAnterior) {
        cabecalho = `<h2 class="titulo-categoria">${categoria ? escapeHtml(categoria) : "Outros"}</h2>`;
        categoriaAnterior = categoria;
      }
      const meta = [item.forma, item.sabor ? `Sabor ${item.sabor}` : null].filter(Boolean).join(" · ");
      return `
      ${cabecalho}
      <div class="cartao-item" data-item="${item.id}" data-categoria="${escapeHtml(categoria)}">
        <div class="item-principal">
          ${htmlGaleria(item)}
          <div class="item-info">
            <div class="categoria-inline">${escapeHtml(categoria || "Outros")}</div>
            <h3>${escapeHtml(item.nome)}</h3>
            ${meta ? `<div class="meta">${escapeHtml(meta)}</div>` : ""}
            <div class="faixas-ref">${htmlFaixasRef(item)}</div>
            <div class="item-linha-qtd">
              <label>Quantidade</label>
              <input type="number" min="0" placeholder="0" data-qtd-item="${item.id}">
              <span class="item-preco-unit" data-preco-unit-item="${item.id}"></span>
              <span class="item-subtotal" data-subtotal-item="${item.id}"></span>
            </div>
            <div class="aviso-desconto" data-aviso-desconto="${item.id}"></div>
          </div>
        </div>
        ${htmlNutricional(item)}
        ${item.complemento ? `<div class="item-complemento">${escapeHtml(item.complemento)}</div>` : ""}
      </div>`;
    }).join("");

    lista.querySelectorAll("[data-qtd-item]").forEach((input) => {
      input.addEventListener("input", () => {
        const itemId = Number(input.dataset.qtdItem);
        const qtd = Math.max(0, parseInt(input.value || "0", 10) || 0);
        if (qtd > 0) quantidades[itemId] = qtd; else delete quantidades[itemId];
        atualizarSubtotalItem(itemId, qtd);
        atualizarDicaProximaFaixa(itemId, qtd);
        atualizarResumo();
      });
    });

    // Clicar numa miniatura troca a foto/vídeo principal daquele produto.
    lista.querySelectorAll("[data-galeria-produto]").forEach((galeria) => {
      const itemId = Number(galeria.dataset.galeriaProduto);
      const item = itens.find((i) => i.id === itemId);
      galeria.querySelectorAll("[data-galeria-mini]").forEach((mini) => {
        mini.addEventListener("click", () => {
          const indice = Number(mini.dataset.indice);
          const midia = item.imagens[indice];
          galeria.querySelector("[data-galeria-principal]").innerHTML = _htmlMidia(midia, "principal");
          galeria.querySelectorAll("[data-galeria-mini]").forEach((m) => m.classList.remove("ativa"));
          mini.classList.add("ativa");
        });
      });
    });
  }

  let modoTelaCheia = false;
  let indiceAtual = 0;

  // Mostra a tela de categorias -- primeira coisa que o cliente vê
  // depois da capa, quando existe pelo menos uma categoria.
  function renderTelaCategorias() {
    const total = itens.length;
    const grade = document.getElementById("grade-categorias");
    grade.innerHTML = `
      <button type="button" class="tile-categoria tile-todos" data-categoria="" style="--i:0">
        <span class="icone-categoria">🗂️</span>
        <span>
          <span class="tile-categoria-nome" style="display:block;">Ver o catálogo todo</span>
          <span class="tile-categoria-qtd">${total} produto${total === 1 ? "" : "s"}</span>
        </span>
      </button>
    ` + categoriasInfo.map((c, i) => `
      <button type="button" class="tile-categoria" data-categoria="${escapeHtml(c.nome)}" style="--tint:${c.cor}; --i:${i + 1}">
        <span class="icone-categoria">${c.icone}</span>
        <span class="tile-categoria-nome">${escapeHtml(c.nome)}</span>
        <span class="tile-categoria-qtd">${c.qtd} produto${c.qtd === 1 ? "" : "s"}</span>
      </button>`).join("");

    grade.querySelectorAll(".tile-categoria").forEach((tile) => {
      tile.addEventListener("click", () => {
        categoriaAtual = tile.dataset.categoria || null;
        abrirListaDeItens();
      });
      tile.addEventListener("mousemove", (e) => {
        const r = tile.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;
        tile.style.transform = `translateY(-2px) rotateX(${(-y * 8).toFixed(2)}deg) rotateY(${(x * 10).toFixed(2)}deg)`;
      });
      tile.addEventListener("mouseleave", () => { tile.style.transform = ""; });
    });

    document.getElementById("tela-categorias").hidden = false;
    document.getElementById("lista-itens").hidden = true;
    document.getElementById("barra-modo").hidden = true;
    document.getElementById("nav-tela-cheia").hidden = true;
    atualizarResumo();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function abrirListaDeItens() {
    modoTelaCheia = false;
    indiceAtual = 0;
    document.getElementById("tela-categorias").hidden = true;
    document.getElementById("lista-itens").hidden = false;
    document.getElementById("barra-modo").hidden = false;
    document.getElementById("botao-trocar-categoria").textContent = categoriaAtual ? `🏷️ ${categoriaAtual}` : "🏷️ Todas as categorias";
    document.getElementById("botao-trocar-categoria").hidden = !categoriasInfo.length;
    atualizarVisibilidadeItens();
    atualizarResumo();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  // Um card só some de vez em duas situações: não é da categoria
  // escolhida, ou (no modo tela cheia) não é o item da vez. Os dois
  // filtros vivem juntos aqui pra nunca brigar um com o outro.
  function atualizarVisibilidadeItens() {
    const lista = document.getElementById("lista-itens");
    const navCheia = document.getElementById("nav-tela-cheia");
    lista.classList.toggle("modo-cheia", modoTelaCheia);
    document.body.classList.toggle("modo-cheia-ativo", modoTelaCheia);
    navCheia.hidden = !modoTelaCheia;

    const todosCards = Array.from(lista.querySelectorAll(".cartao-item"));
    const cabecalhos = Array.from(lista.querySelectorAll(".titulo-categoria"));
    const filtrados = categoriaAtual === null ? todosCards : todosCards.filter((c) => c.dataset.categoria === categoriaAtual);

    if (modoTelaCheia) {
      if (indiceAtual >= filtrados.length) indiceAtual = Math.max(0, filtrados.length - 1);
      todosCards.forEach((c) => { c.hidden = true; });
      if (filtrados[indiceAtual]) filtrados[indiceAtual].hidden = false;
      cabecalhos.forEach((h) => { h.hidden = true; });
      document.getElementById("contador-tela-cheia").textContent = `${filtrados.length ? indiceAtual + 1 : 0} / ${filtrados.length}`;
      document.getElementById("botao-anterior").disabled = indiceAtual <= 0;
      document.getElementById("botao-proximo").disabled = indiceAtual >= filtrados.length - 1;
      window.scrollTo({ top: 0, behavior: "auto" });
    } else {
      todosCards.forEach((c) => { c.hidden = !filtrados.includes(c); });
      // Cabeçalho de seção só faz sentido vendo tudo -- filtrando uma
      // categoria só, ele vira ruído repetindo o que já tá dito ali em cima.
      cabecalhos.forEach((h) => { h.hidden = categoriaAtual !== null; });
    }
  }

  document.getElementById("botao-trocar-categoria").addEventListener("click", () => {
    renderTelaCategorias();
  });
  document.getElementById("botao-tela-cheia").addEventListener("click", () => {
    modoTelaCheia = true;
    indiceAtual = 0;
    atualizarVisibilidadeItens();
  });
  document.getElementById("botao-sair-tela-cheia").addEventListener("click", () => {
    modoTelaCheia = false;
    atualizarVisibilidadeItens();
  });
  document.getElementById("botao-anterior").addEventListener("click", () => {
    if (indiceAtual > 0) { indiceAtual--; atualizarVisibilidadeItens(); }
  });
  document.getElementById("botao-proximo").addEventListener("click", () => {
    indiceAtual++; atualizarVisibilidadeItens();
  });

  function atualizarSubtotalItem(itemId, qtd) {
    const item = itens.find((i) => i.id === itemId);
    const elSubtotal = document.querySelector(`[data-subtotal-item="${itemId}"]`);
    const elUnitario = document.querySelector(`[data-preco-unit-item="${itemId}"]`);
    if (!item || !elSubtotal || !elUnitario) return;
    if (!qtd) { elSubtotal.textContent = ""; elUnitario.textContent = ""; return; }
    const preco = precoDaFaixa(item, qtd);
    elSubtotal.textContent = preco != null ? fmtMoeda(preco * qtd) : "fora das faixas";
    elSubtotal.style.color = preco != null ? "" : "#c93a3f";
    elUnitario.textContent = preco != null ? `${fmtMoeda(preco)} / un.` : "";
  }

  function atualizarDicaProximaFaixa(itemId, qtd) {
    const item = itens.find((i) => i.id === itemId);
    const el = document.querySelector(`[data-aviso-desconto="${itemId}"]`);
    if (!item || !el) return;
    const dica = _dicaProximaFaixa(item, qtd);
    if (dica) { el.textContent = dica; el.classList.add("mostrar"); }
    else { el.textContent = ""; el.classList.remove("mostrar"); }
  }

  function atualizarResumo() {
    const ids = Object.keys(quantidades);
    const barra = document.getElementById("barra-total");
    if (!ids.length) { barra.hidden = true; return; }
    let total = 0, valido = true;
    ids.forEach((id) => {
      const item = itens.find((i) => i.id === Number(id));
      const preco = precoDaFaixa(item, quantidades[id]);
      if (preco == null) valido = false; else total += preco * quantidades[id];
    });
    document.getElementById("resumo-itens").textContent = `${ids.length} ${ids.length === 1 ? "item" : "itens"}`;
    document.getElementById("resumo-total").textContent = fmtMoeda(total);
    document.getElementById("botao-enviar").disabled = !valido;
    barra.hidden = false;
  }

  async function carregar() {
    try {
      const resp = await fetch(`${API}/${token}`);
      if (!resp.ok) {
        const erro = await resp.json().catch(() => ({}));
        throw new Error(erro.mensagem || "Não foi possível abrir este catálogo.");
      }
      const dados = await resp.json();
      itens = dados.itens || [];
      categoriasInfo = dados.categorias || [];
      if (dados.logo_url) { document.getElementById("logo").src = dados.logo_url; document.getElementById("logo").hidden = false; }
      if (dados.contato_nome) document.getElementById("titulo-saudacao").textContent = `Olá, ${dados.contato_nome}!`;
      document.getElementById("estado-carregando").hidden = true;
      if (!itens.length) {
        document.getElementById("texto-erro").textContent = "Nenhum produto disponível no momento.";
        document.getElementById("estado-erro").hidden = false;
        return;
      }
      renderItens();
      if (categoriasInfo.length) renderTelaCategorias();
      else abrirListaDeItens();
    } catch (e) {
      document.getElementById("estado-carregando").hidden = true;
      document.getElementById("texto-erro").textContent = e.message;
      document.getElementById("estado-erro").hidden = false;
    }
  }

  document.getElementById("botao-enviar").addEventListener("click", async (ev) => {
    const botao = ev.currentTarget;
    botao.disabled = true;
    botao.textContent = "Enviando…";
    const corpo = { itens: Object.keys(quantidades).map((id) => ({ item_id: Number(id), quantidade: quantidades[id] })) };
    try {
      const resp = await fetch(`${API}/${token}/proposta`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo),
      });
      if (!resp.ok) {
        const erro = await resp.json().catch(() => ({}));
        throw new Error(erro.mensagem || "Não deu pra enviar a proposta.");
      }
      document.getElementById("lista-itens").hidden = true;
      document.getElementById("barra-total").hidden = true;
      document.getElementById("tela-sucesso").hidden = false;
    } catch (e) {
      alert(e.message);
      botao.disabled = false;
      botao.textContent = "Enviar proposta";
    }
  });

  document.getElementById("botao-comecar").addEventListener("click", () => {
    document.getElementById("tela-capa").hidden = true;
  });
  document.getElementById("tela-capa").hidden = false;
  carregar();
})();
</script>
</body>
</html>
